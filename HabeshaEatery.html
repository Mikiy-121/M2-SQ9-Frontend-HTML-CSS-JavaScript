<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact & Hours — Habesha Eatery</title>
    <meta
      name="description"
      content="Contact Habesha Eatery or check our opening hours. Reach us by phone, email, or send a message directly."
      <link rel="stylesheet" href="styleHabesha.css" />
      />
  </head>
  <body>
    <header>
      <h1>Habesha Eatery</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">Contact & Hours</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="contact">
        <h2>Contact Us</h2>
        <form action="#" method="post">
          <label for="cname">Full Name</label>
          <input type="text" id="cname" name="cname" required />

          <label for="cemail">Email</label>
          <input type="email" id="cemail" name="cemail" required />

          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>

      <section id="hours">
        <h2>Opening Hours</h2>
        <table>
          <caption>
            Habesha Eatery — Weekly Opening Hours
          </caption>
          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Opening Time</th>
              <th scope="col">Closing Time</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Monday – Friday</th>
              <td>08:00</td>
              <td>22:00</td>
            </tr>
            <tr>
              <th scope="row">Saturday</th>
              <td>09:00</td>
              <td>23:00</td>
            </tr>
            <tr>
              <th scope="row">Sunday</th>
              <td>10:00</td>
              <td>20:00</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>
      <p>2026 Habesha Eatery. All rights reserved.</p>
    </footer>
  </body>
</html>
