<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bole Weather</title>
    <link rel="stylesheet" href="./styles.css" />

  </head>
  <body>
    <header>
      <h1>Bole Weather</h1>
      <input
        id="search"
        type="text"
        placeholder="Search Ethiopian cities…"
        aria-label="Search cities"

        />
    </header>

    <main>
      <section id="cities" aria-label="Cities">
        <p class="loading">Loading cities…</p>
      </section>

      <aside id="saved" aria-label="Saved cities">
        <h2>Saved</h2>
        <ul id="saved-list"></ul>
      </aside>
    </main>

    <footer>
      <p>Live weather for Ethiopian cities.</p>
    </footer>




    <script src="./app.js" defer></script>
  </body>
</html>
